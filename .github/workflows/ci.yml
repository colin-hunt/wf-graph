name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # `npm ci` runs the prepare script, which builds dist/.
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Smoke test: the packed CLI starts and serves the fixtures.
      - run: |
          node dist/cli.js test/fixtures --no-open --port 4321 &
          sleep 2
          curl -fsS http://localhost:4321/api/files | grep -q branching.yaml
          curl -fsS http://localhost:4321/ | grep -q '<div id="root">'
